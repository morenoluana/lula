<title>Mon cahier de français</title>
<meta name="description" content="Cuaderno de práctica de francés en español, siguiendo los niveles de Cosmopolite (A1 a C1).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --paper: #f6f7fb;
  --sheet: #ffffff;
  --ink: #1b2030;
  --ink-soft: #545c73;
  --line: #d3dbef;
  --line-strong: #a9b6dc;
  --encre: #2345a8;
  --encre-soft: #e5ebfa;
  --marge: #cf3348;
  --ok: #1d7a4c;
  --ok-soft: #e1f3e9;
  --bad: #b3261e;
  --bad-soft: #fbe6e4;
  --warn: #8a5a00;
  --warn-soft: #fbf0d9;
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #10131d;
    --sheet: #171b28;
    --ink: #e7eaf3;
    --ink-soft: #a3abc2;
    --line: #262d44;
    --line-strong: #3a4466;
    --encre: #8ea6ff;
    --encre-soft: #1f2744;
    --marge: #ff7a8a;
    --ok: #62d49a;
    --ok-soft: #14301f;
    --bad: #ff8a80;
    --bad-soft: #3a1a18;
    --warn: #f0c060;
    --warn-soft: #33290f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #10131d;
  --sheet: #171b28;
  --ink: #e7eaf3;
  --ink-soft: #a3abc2;
  --line: #262d44;
  --line-strong: #3a4466;
  --encre: #8ea6ff;
  --encre-soft: #1f2744;
  --marge: #ff7a8a;
  --ok: #62d49a;
  --ok-soft: #14301f;
  --bad: #ff8a80;
  --bad-soft: #3a1a18;
  --warn: #f0c060;
  --warn-soft: #33290f;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
}
.wrap {
  max-width: 880px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 20px 56px;
}
h1, h2, h3 { font-family: var(--display); font-weight: 400; text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font-size: clamp(1.7rem, 5vw, 2.4rem); }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.15rem; }
p { margin: 0; max-width: 65ch; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--encre); outline-offset: 2px; }

/* Header */
header.top { display: grid; gap: 14px; }
.eyebrow { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--marge); font-weight: 700; }
.lead { color: var(--ink-soft); }

/* Level track: Cosmopolite 1–5 */
.track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.lvl {
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  padding: 8px 10px;
  background: var(--sheet);
  display: grid;
  gap: 2px;
}
.lvl b { font-family: var(--mono); font-size: .95rem; }
.lvl span { font-size: .75rem; color: var(--ink-soft); }
.lvl.now { border-color: var(--encre); background: var(--encre-soft); }
.lvl.now b { color: var(--encre); }
.lvl .bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 4px; }
.lvl .bar i { display: block; height: 100%; background: var(--encre); width: 0; transition: width .3s; }

/* Tabs */
nav.tabs {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--paper);
  display: flex;
  gap: 4px;
  padding-block: 10px;
  margin-top: 18px;
  border-bottom: 1px solid var(--line-strong);
  overflow-x: auto;
}
nav.tabs button {
  border: 0;
  background: transparent;
  padding: 8px 14px;
  border-radius: 999px;
  color: var(--ink-soft);
  font-weight: 700;
  white-space: nowrap;
}
nav.tabs button[aria-selected="true"] { background: var(--encre); color: var(--sheet); }

/* Seyès sheet: the ruled paper of French school notebooks */
.sheet {
  position: relative;
  background-color: var(--sheet);
  background-image:
    linear-gradient(to right, transparent 46px, var(--marge) 46px, var(--marge) 48px, transparent 48px),
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--line) 31px 32px);
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  padding-block: 22px 26px;
  padding-inline: 64px 22px;
  margin-top: 20px;
  display: grid;
  gap: 16px;
}
@media (max-width: 520px) {
  .sheet {
    background-image:
      linear-gradient(to right, transparent 18px, var(--marge) 18px, var(--marge) 20px, transparent 20px),
      repeating-linear-gradient(to bottom, transparent 0 31px, var(--line) 31px 32px);
    padding-inline: 32px 16px;
  }
  .track { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  .lvl { padding: 6px; }
  .lvl span { display: none; }
}

/* Lesson list */
.lessons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.lessons button {
  border: 1px solid var(--line-strong);
  background: var(--sheet);
  border-radius: 8px;
  padding: 8px 12px;
  display: flex;
  gap: 8px;
  align-items: center;
  text-align: left;
}
.lessons button[aria-pressed="true"] { border-color: var(--encre); box-shadow: inset 0 0 0 1px var(--encre); }
.lessons .n { font-family: var(--mono); font-size: .8rem; color: var(--encre); }
.lessons .done { color: var(--ok); font-weight: 700; }

/* Phrase table */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
td, th { text-align: left; padding: 6px 8px; vertical-align: top; border-bottom: 1px solid var(--line); }
th { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); font-weight: 700; }
td.fr { font-weight: 700; color: var(--encre); }
td.pr { font-family: var(--mono); font-size: .82rem; color: var(--ink-soft); }
.say {
  border: 1px solid var(--line-strong);
  background: var(--sheet);
  border-radius: 999px;
  width: 32px; height: 32px;
  display: inline-grid; place-items: center;
  flex: none;
}
.say svg { width: 16px; height: 16px; fill: var(--encre); }

.note {
  border-left: 3px solid var(--marge);
  padding: 8px 12px;
  background: var(--paper);
  border-radius: 0 6px 6px 0;
}
.note b { color: var(--marge); }

/* Quiz */
.q { display: grid; gap: 8px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opts button {
  border: 1px solid var(--line-strong);
  background: var(--sheet);
  border-radius: 8px;
  padding: 6px 12px;
}
.opts button.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 700; }
.opts button.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.btn {
  border: 0;
  background: var(--encre);
  color: var(--sheet);
  border-radius: 8px;
  padding: 10px 16px;
  font-weight: 700;
}
.btn.ghost { background: transparent; color: var(--encre); border: 1px solid var(--encre); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Flashcards */
.card {
  min-height: 190px;
  display: grid;
  place-items: center;
  text-align: center;
  gap: 10px;
  border: 1px dashed var(--line-strong);
  border-radius: 10px;
  padding: 20px;
  background: var(--sheet);
}
.card .big { font-family: var(--display); font-size: clamp(1.6rem, 6vw, 2.3rem); color: var(--encre); }
.card .small { color: var(--ink-soft); }
.grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grade button { border: 1px solid var(--line-strong); background: var(--sheet); border-radius: 8px; padding: 10px 6px; font-weight: 700; }
.grade .g0 { color: var(--bad); border-color: var(--bad); }
.grade .g1 { color: var(--encre); border-color: var(--encre); }
.grade .g2 { color: var(--ok); border-color: var(--ok); }
.boxes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.boxes div { border: 1px solid var(--line); border-radius: 6px; padding: 6px; text-align: center; background: var(--sheet); }
.boxes b { display: block; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 1.1rem; }
.boxes span { font-size: .72rem; color: var(--ink-soft); }

/* Conjugation */
.conj-prompt { font-family: var(--display); font-size: 1.5rem; }
.conj-prompt em { font-style: normal; color: var(--marge); }
input[type="text"] {
  width: 100%;
  max-width: 360px;
  padding: 10px 12px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: var(--sheet);
  font-family: var(--mono);
}
.accents { display: flex; flex-wrap: wrap; gap: 4px; }
.accents button { border: 1px solid var(--line); background: var(--sheet); border-radius: 6px; width: 34px; height: 34px; font-family: var(--mono); }
.fb { padding: 8px 12px; border-radius: 6px; }
.fb.ok { background: var(--ok-soft); color: var(--ok); }
.fb.bad { background: var(--bad-soft); color: var(--bad); }
.fb.warn { background: var(--warn-soft); color: var(--warn); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px 10px; background: var(--sheet); font-family: var(--mono); font-size: .85rem; }
.conjtable td { font-family: var(--mono); font-size: .9rem; }

.muted { color: var(--ink-soft); font-size: .9rem; }
.score { font-family: var(--mono); font-variant-numeric: tabular-nums; }
ul.plain { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; max-width: 65ch; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">Cahier de Luana · niveau A1</div>

</div>

<script>
/* ---------- Data ---------- */

const LEVELS = [
  { book: "Cosmo 1", cefr: "A1", label: "Primeros pasos" },
  { book: "Cosmo 2", cefr: "A2", label: "Vida diaria" },
  { book: "Cosmo 3", cefr: "B1", label: "Independiente" },
  { book: "Cosmo 4", cefr: "B2", label: "Opinar y debatir" },
  { book: "Cosmo 5", cefr: "C1", label: "Dominio" }
];

const LESSONS = [
  {
    id: "salut",
    title: "Saludar y presentarse",
    intro: "Lo primero: saludar, decir tu nombre y despedirte. En francés hay dos formas de trato: tu (informal, como «vos») y vous (formal o plural, como «usted» o «ustedes»).",
    phrases: [
      ["Bonjour !", "¡Buen día! / ¡Hola!", "bon-YUR"],
      ["Salut !", "¡Hola! / ¡Chau! (informal)", "sa-LÜ"],
      ["Bonsoir !", "¡Buenas noches! (al llegar)", "bon-SUAR"],
      ["Je m'appelle Luana.", "Me llamo Luana.", "zhe ma-PEL"],
      ["Comment tu t'appelles ?", "¿Cómo te llamás?", "ko-MAN tü ta-PEL"],
      ["Comment vous appelez-vous ?", "¿Cómo se llama usted?", "ko-MAN vu-za-plé VU"],
      ["Enchanté / Enchantée", "Encantado / Encantada", "an-shan-TÉ"],
      ["Ça va ?", "¿Todo bien?", "sa VA"],
      ["Ça va bien, merci.", "Bien, gracias.", "sa va BIAN, mer-SÍ"],
      ["Au revoir !", "¡Adiós!", "o re-VUAR"],
      ["À bientôt !", "¡Hasta pronto!", "a bian-TÓ"],
      ["S'il te plaît / S'il vous plaît", "Por favor (tu / vous)", "sil te PLÉ / sil vu PLÉ"]
    ],
    notes: [
      "<b>Ojo:</b> «Bonsoir» se usa para saludar a la noche. Para despedirte a la noche se dice «Bonne soirée !» o «Bonne nuit !» si te vas a dormir.",
      "<b>Ojo:</b> «Enchantée» con doble e lo escribe una mujer. Suena igual."
    ],
    quiz: [
      { q: "Llegás a una panadería a las 10 de la mañana. ¿Qué decís?", opts: ["Bonsoir !", "Bonjour !", "Bonne nuit !"], a: 1 },
      { q: "¿Cómo le preguntás el nombre a tu profesora?", opts: ["Comment tu t'appelles ?", "Comment vous appelez-vous ?", "Ça va ?"], a: 1 },
      { q: "Sos mujer y te presentan a alguien. Escribís:", opts: ["Enchanté", "Enchantée", "Enchantés"], a: 1 }
    ]
  },
  {
    id: "sons",
    title: "Sonidos clave",
    intro: "El francés no se lee como se escribe. Con estas pocas reglas ya vas a poder leer casi todo lo del nivel A1.",
    phrases: [
      ["tu", "vos (la u francesa)", "tü: decí «i» con los labios en «u»"],
      ["tout", "todo (ou = u)", "tu"],
      ["beau", "lindo (eau = o)", "bo"],
      ["mai", "mayo (ai = e abierta)", "me"],
      ["deux", "dos (eu)", "dö: decí «e» con labios en «o»"],
      ["pain", "pan (vocal nasal)", "pan, sin pronunciar la n"],
      ["bon", "bueno (vocal nasal)", "bon, sin pronunciar la n"],
      ["chat", "gato (ch = sh)", "sha"],
      ["je", "yo (j suave)", "zhe, como la ll porteña"],
      ["petit", "chico (la t final no suena)", "pe-TÍ"]
    ],
    notes: [
      "<b>Regla de oro:</b> las consonantes finales casi nunca suenan. Excepciones fáciles: C, R, F, L (pensá en «CaReFuL»): sac, bonjour, neuf, sel.",

    quiz: [
      { q: "¿Cómo suena «eau» en «beau»?", opts: ["e-a-u", "o", "u"], a: 1 },
      { q: "En «petit», la t final…", opts: ["suena fuerte", "no suena", "suena como d"], a: 1 },

  {
    id: "nombres",
    title: "Números del 0 al 20",

    phrases: [
      ["zéro", "0", "ze-RÓ"], ["un / une", "1", "an / ün"], ["deux", "2", "dö"], ["trois", "3", "truá"],
      ["quatre", "4", "KATR"], ["cinq", "5", "sank"], ["six", "6", "sis"], ["sept", "7", "set"],
      ["huit", "8", "üit"], ["neuf", "9", "nöf"], ["dix", "10", "dis"], ["onze", "11", "onz"],
      ["douze", "12", "duz"], ["treize", "13", "trez"], ["quatorze", "14", "ka-TORZ"], ["quinze", "15", "kanz"],
      ["seize", "16", "sez"], ["dix-sept", "17", "di-SET"], ["dix-huit", "18", "di-ZÜIT"], ["dix-neuf", "19", "diz-NÖF"],
      ["vingt", "20", "van"]
    ],
    notes: [
      "<b>Para decir la edad</b> se usa avoir (tener), igual que en castellano: «J'ai vingt ans.» = Tengo veinte años."

      { q: "«J'ai dix-neuf ans» quiere decir…", opts: ["Tengo 9 años", "Tengo 19 años", "Tengo 10 años"], a: 1 }
    ]
  },
  {
    id: "etre",
    title: "Être y avoir",
    intro: "Être (ser/estar) y avoir (tener) son los dos verbos más importantes del francés. Además, el sujeto siempre se dice: no alcanza con «suis», hay que decir «je suis».",
    phrases: [
      ["je suis", "yo soy / estoy", "zhe SÜI"], ["tu es", "vos sos", "tü É"], ["il / elle est", "él / ella es", "il É / el É"],
      ["nous sommes", "nosotros somos", "nu SOM"], ["vous êtes", "ustedes son / usted es", "vu-ZET"], ["ils / elles sont", "ellos / ellas son", "il SON"],

      ["J'habite en Argentine.", "Vivo en Argentina.", "zha-BIT an-nar-zhan-TIN"],
      ["J'habite à Buenos Aires.", "Vivo en Buenos Aires.", "zha-BIT a …"],

  ["le travail", "el trabajo"], ["l'étudiant / l'étudiante", "el / la estudiante"], ["la maison", "la casa"], ["l'appartement", "el departamento"],
  ["aujourd'hui", "hoy"], ["demain", "mañana"], ["hier", "ayer"], ["maintenant", "ahora"],
  ["lundi", "lunes"], ["mardi", "martes"], ["mercredi", "miércoles"], ["jeudi", "jueves"],
  ["vendredi", "viernes"], ["samedi", "sábado"], ["dimanche", "domingo"], ["le café", "el café"],
  ["l'eau", "el agua"], ["le pain", "el pan"], ["le fromage", "el queso"], ["l'addition", "la cuenta (en un bar)"],
  ["petit / petite", "chico / chica"], ["grand / grande", "grande / alto"], ["beau / belle", "lindo / linda"], ["facile", "fácil"],
  ["difficile", "difícil"], ["j'aime", "me gusta / amo"], ["je voudrais", "quisiera"], ["il y a", "hay"],
  ["où ?", "¿dónde?"], ["quand ?", "¿cuándo?"], ["pourquoi ?", "¿por qué?"], ["combien ?", "¿cuánto?"]
];

const PRONOUNS = ["je", "tu", "il / elle", "nous", "vous", "ils / elles"];
const VERBS = {
  "être": { es: "ser / estar", forms: ["suis", "es", "est", "sommes", "êtes", "sont"] },
  "avoir": { es: "tener", forms: ["ai", "as", "a", "avons", "avez", "ont"] },
  "s'appeler": { es: "llamarse", forms: ["m'appelle", "t'appelles", "s'appelle", "nous appelons", "vous appelez", "s'appellent"] },
  "parler": { es: "hablar", forms: ["parle", "parles", "parle", "parlons", "parlez", "parlent"] },
  "habiter": { es: "vivir (en)", forms: ["habite", "habites", "habite", "habitons", "habitez", "habitent"] },
  "aller": { es: "ir", forms: ["vais", "vas", "va", "allons", "allez", "vont"] },
  "faire": { es: "hacer", forms: ["fais", "fais", "fait", "faisons", "faites", "font"] }
};

/* ---------- Storage (per viewer, optional) ---------- */

const KEY = "cahier-fr-v1";
function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
}
const state = Object.assign({ done: {}, cards: {}, verbs: ["être", "avoir"] }, load());
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

/* ---------- Helpers ---------- */

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SPEAKER = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
const sayBtn = text => `<button class="say" data-say="${esc(text)}" aria-label="Escuchar: ${esc(text)}">${SPEAKER}</button>`;

let frVoice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  frVoice = vs.find(v => v.lang === "fr-FR") || vs.find(v => v.lang && v.lang.startsWith("fr")) || null;
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text.replace(/\s*\/\s*/g, ", "));
  u.lang = "fr-FR";
  u.rate = 0.85;
  if (frVoice) u.voice = frVoice;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-say]");
  if (b) speak(b.dataset.say);
});

const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
const DAY = 86400000;

/* ---------- Tabs ---------- */

const tabs = [...document.querySelectorAll("nav.tabs button")];
function showTab(name) {
  tabs.forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === name)));
  document.querySelectorAll("[role=tabpanel]").forEach(p => { p.hidden = p.id !== name; });
  if (name === "cartes") renderCards();
  if (name === "conj") renderConj();
  if (name === "plan") renderPlan();
}
tabs.forEach(t => t.addEventListener("click", () => showTab(t.dataset.tab)));

/* ---------- Level track ---------- */

function renderTrack() {
  const pct = Math.round(100 * Object.keys(state.done).filter(k => state.done[k]).length / LESSONS.length);
  $("#track").innerHTML = LEVELS.map((l, i) => `
    <div class="lvl${i === 0 ? " now" : ""}">
      <b>${l.cefr}</b><span>${l.book} · ${l.label}</span>
      <div class="bar"><i style="width:${i === 0 ? pct : 0}%"></i></div>
    </div>`).join("");
}

/* ---------- Lessons ---------- */

let current = LESSONS[0].id;
function renderLessonList() {
  $("#lessonList").innerHTML = LESSONS.map((l, i) => `
    <button aria-pressed="${l.id === current}" data-lesson="${l.id}">
      <span class="n">${String(i + 1).padStart(2, "0")}</span>
      <span>${esc(l.title)}</span>
      ${state.done[l.id] ? '<span class="done" aria-label="completada">✓</span>' : ""}
    </button>`).join("");
}
$("#lessonList").addEventListener("click", e => {
  const b = e.target.closest("[data-lesson]");
  if (!b) return;
  current = b.dataset.lesson;
  renderLessonList();
  renderLesson();
});

function renderLesson() {
  const l = LESSONS.find(x => x.id === current);
  const i = LESSONS.indexOf(l);
  $("#lesson").innerHTML = `
    <div class="eyebrow">Leçon ${i + 1} · A1</div>
    <h2>${esc(l.title)}</h2>
    <p>${esc(l.intro)}</p>
    <div class="tablewrap"><table>
      <thead><tr><th></th><th>Francés</th><th>Castellano</th><th>Cómo suena</th></tr></thead>
      <tbody>${l.phrases.map(p => `<tr><td>${sayBtn(p[0])}</td><td class="fr">${esc(p[0])}</td><td>${esc(p[1])}</td><td class="pr">${esc(p[2])}</td></tr>`).join("")}</tbody>
    </table></div>
    ${l.notes.map(n => `<div class="note">${n}</div>`).join("")}
    <h3>Mini prueba</h3>
    <div id="quiz" style="display:grid;gap:16px">
      ${l.quiz.map((q, qi) => `
        <div class="q" data-q="${qi}">
          <p>${qi + 1}. ${esc(q.q)}</p>
          <div class="opts">${q.opts.map((o, oi) => `<button data-o="${oi}">${esc(o)}</button>`).join("")}</div>
        </div>`).join("")}
    </div>
    <p class="muted score" id="quizScore">0 / ${l.quiz.length}</p>
  `;
  let right = 0;
  $("#quiz").addEventListener("click", e => {
    const b = e.target.closest("[data-o]");
    if (!b) return;
    const box = b.closest(".q");
    if (box.dataset.answered) return;
    box.dataset.answered = "1";
    const q = l.quiz[+box.dataset.q];
    const pick = +b.dataset.o;
    box.querySelectorAll("[data-o]").forEach(x => { if (+x.dataset.o === q.a) x.classList.add("right"); });
    if (pick === q.a) right++; else b.classList.add("wrong");
    $("#quizScore").textContent = `${right} / ${l.quiz.length}`;
    const answered = $("#quiz").querySelectorAll("[data-answered]").length;
    if (answered === l.quiz.length) {
      if (right === l.quiz.length) {
        state.done[l.id] = true;
        save();
        $("#quizScore").textContent += " · ¡Lección completada!";
        renderLessonList();
        renderTrack();
      } else {
        $("#quizScore").textContent += " · Repasá la tabla y volvé a intentarlo.";
        const again = document.createElement("button");
        again.className = "btn ghost";
        again.textContent = "Reintentar";
        again.addEventListener("click", renderLesson);
        $("#quizScore").after(again);
      }
    }
  });
}

/* ---------- Flashcards: Leitner boxes ---------- */

const INTERVALS = [0, 1, 3, 7, 16];
function cardState(fr) {
  return state.cards[fr] || { box: 0, due: 0 };
}
let queue = [], flipped = false, reverse = false;
function buildQueue() {
  const t = today();
  const due = CARDS.filter(c => cardState(c[0]).due <= t);
  const seen = due.filter(c => state.cards[c[0]]);
  const fresh = due.filter(c => !state.cards[c[0]]).slice(0, 8);
  queue = [...seen, ...fresh].slice(0, 20);
}
function renderCards() {
  if (!queue.length) buildQueue();
  const counts = [0, 0, 0, 0, 0];
  CARDS.forEach(c => { if (state.cards[c[0]]) counts[state.cards[c[0]].box]++; });
  const unseen = CARDS.filter(c => !state.cards[c[0]]).length;
  const c = queue[0];
  $("#cards").innerHTML = `
    <div class="eyebrow">Vocabulario A1 · ${CARDS.length} palabras</div>
    <h2>Tarjetas</h2>
    <p class="muted">Cada tarjeta que acertás pasa a una caja con repaso más espaciado (hoy, 1, 3, 7 y 16 días). Si la errás, vuelve a la primera. Hacé una ronda por día.</p>
    <div class="row">
      <div class="chips"><label><input type="checkbox" id="rev" ${reverse ? "checked" : ""}> castellano → francés</label></div>
    </div>
    ${c ? `
      <div class="card" id="card">
        <div class="small">${queue.length} para hoy</div>
        <div class="big">${esc(reverse ? c[1] : c[0])}</div>
        ${flipped ? `<div style="font-size:1.2rem">${esc(reverse ? c[0] : c[1])}</div>` : `<div class="small">Pensá la respuesta y dala vuelta</div>`}
        ${sayBtn(c[0])}
      </div>
      ${flipped ? `
        <div class="grade">
          <button class="g0" data-g="0">Otra vez</button>
          <button class="g1" data-g="1">Bien</button>
          <button class="g2" data-g="2">Fácil</button>
        </div>` : `<button class="btn" id="flip">Dar vuelta</button>`}
    ` : `
      <div class="card"><div class="big">C'est fini !</div><div class="small">No quedan tarjetas para hoy. Volvé mañana.</div></div>
    `}
    <div class="boxes">
      ${counts.map((n, i) => `<div><b>${n}</b><span>caja ${i + 1}</span></div>`).join("")}
    </div>
    <p class="muted">${unseen} palabras sin ver todavía.</p>
  `;
  $("#rev").addEventListener("change", e => { reverse = e.target.checked; flipped = false; renderCards(); });
  const f = $("#flip");
  if (f) f.addEventListener("click", () => { flipped = true; renderCards(); });
  $("#cards").querySelectorAll("[data-g]").forEach(b => b.addEventListener("click", () => grade(+b.dataset.g)));
}
function grade(g) {
  const c = queue.shift();
  const s = cardState(c[0]);
  let box = g === 0 ? 0 : Math.min(4, s.box + g);
  state.cards[c[0]] = { box, due: today() + INTERVALS[box] * DAY };
  if (g === 0) queue.push(c);
  save();
  flipped = false;
  renderCards();
}

/* ---------- Conjugation drill ---------- */

const norm = s => s.toLowerCase().replace(/[’`]/g, "'").replace(/\s+/g, " ").trim();
const strip = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace("œ", "oe");
function subject(pi, form) {
  if (pi === 0 && /^[aeiouhéêè]/.test(form)) return "j'";
  return PRONOUNS[pi];
}
function fullForm(pi, form) {
  const s = subject(pi, form);
  if (/^(nous|vous) /.test(form)) return form.replace(/^(nous|vous) /, `$1 $1 `);
  return s.endsWith("'") ? s + form : s + " " + form;
}
let drill = null;
function nextDrill() {
  const vs = state.verbs.length ? state.verbs : ["être"];
  const v = vs[Math.floor(Math.random() * vs.length)];
  const pi = Math.floor(Math.random() * 6);
  drill = { v, pi };
}
function renderConj() {
  if (!drill) nextDrill();
  const { v, pi } = drill;
  const form = VERBS[v].forms[pi];
  const subj = subject(pi, form);
  $("#conjugate").innerHTML = `
    <div class="eyebrow">Présent de l'indicatif</div>
    <h2>Conjugar</h2>
    <p class="muted">Elegí los verbos que querés practicar y escribí la forma en presente. Podés escribir solo el verbo o la frase entera.</p>
    <div class="chips" id="verbPick">
      ${Object.keys(VERBS).map(k => `<label><input type="checkbox" value="${esc(k)}" ${state.verbs.includes(k) ? "checked" : ""}> ${esc(k)}</label>`).join("")}
    </div>
    <div class="conj-prompt">${esc(PRONOUNS[pi])} + <em>${esc(v)}</em></div>
    <p class="muted">${esc(v)} = ${esc(VERBS[v].es)}</p>
    <form id="conjForm" class="row" autocomplete="off">
      <input type="text" id="conjInput" aria-label="Tu respuesta" autocapitalize="off" spellcheck="false" placeholder="${esc(subj.endsWith("'") ? "j'…" : subj + " …")}">
      <button class="btn" type="submit">Comprobar</button>
    </form>
    <div class="accents" aria-label="Letras con acento">
      ${["é", "è", "ê", "à", "ç", "ô", "î", "û", "ë", "œ"].map(a => `<button type="button" data-acc="${a}">${a}</button>`).join("")}
    </div>
    <div id="conjFb"></div>
    <details>
      <summary>Ver la tabla de ${esc(v)}</summary>
      <div class="tablewrap"><table class="conjtable"><tbody>
        ${VERBS[v].forms.map((f, i) => `<tr><td>${esc(fullForm(i, f))}</td><td>${sayBtn(fullForm(i, f))}</td></tr>`).join("")}
      </tbody></table></div>
    </details>
  `;
  const input = $("#conjInput");
  $("#verbPick").addEventListener("change", () => {
    state.verbs = [...$("#verbPick").querySelectorAll("input:checked")].map(i => i.value);
    save();
    nextDrill();
    renderConj();
  });
  document.querySelectorAll("[data-acc]").forEach(b => b.addEventListener("click", () => {
    const s = input.selectionStart ?? input.value.length;
    input.value = input.value.slice(0, s) + b.dataset.acc + input.value.slice(input.selectionEnd ?? s);
    input.focus();
    input.setSelectionRange(s + 1, s + 1);
  }));
  $("#conjForm").addEventListener("submit", e => {
    e.preventDefault();
    const fb = $("#conjFb");
    if (fb.dataset.done) { nextDrill(); renderConj(); $("#conjInput").focus(); return; }
    const ans = norm(input.value);
    if (!ans) return;
    const full = norm(fullForm(pi, form));
    const accepted = [norm(form), full];
    if (pi > 0) accepted.push(...PRONOUNS[pi].split(" / ").map(p => norm(fullForm(pi, form).replace(PRONOUNS[pi], p))));
    let cls, msg;
    if (accepted.includes(ans)) {
      cls = "ok"; msg = `¡Bien! <b>${esc(fullForm(pi, form))}</b>`;
    } else if (accepted.map(strip).includes(strip(ans))) {
      cls = "warn"; msg = `Casi: revisá los acentos. Es <b>${esc(fullForm(pi, form))}</b>`;
    } else {
      cls = "bad"; msg = `Es <b>${esc(fullForm(pi, form))}</b>`;
    }
    fb.innerHTML = `<div class="fb ${cls}">${msg} ${sayBtn(fullForm(pi, form))}</div><p class="muted">Apretá Enter para la siguiente.</p>`;
    fb.dataset.done = "1";
    speak(fullForm(pi, form));
  });
}

/* ---------- Boot ---------- */

renderTrack();
